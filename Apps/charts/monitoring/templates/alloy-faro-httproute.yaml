{{- if and .Values.alloy.enabled .Values.alloyFaroGateway.enabled }}
{{- $g := .Values.alloyFaroGateway.gateway }}
{{- $sectionNames := default (list "https-tranzrmoves" "http-tranzrmoves") .Values.alloyFaroGateway.sectionNames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ printf "%s-alloy-faro" .Release.Name }}
  namespace: {{ .Release.Namespace | default .Values.namespaceOverride }}
  labels:
    app.kubernetes.io/name: {{ include "monitoring.name" . | quote }}
    app.kubernetes.io/instance: {{ .Release.Name | quote }}
    app.kubernetes.io/component: alloy-faro
spec:
  parentRefs:
{{- range $sectionNames }}
    - name: {{ $g.name | quote }}
      namespace: {{ $g.namespace | quote }}
      sectionName: {{ . | quote }}
{{- end }}
  hostnames:
    - {{ .Values.alloyFaroGateway.host | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.alloyFaroGateway.serviceName | quote }}
          port: {{ .Values.alloyFaroGateway.servicePort }}
{{- end }}
