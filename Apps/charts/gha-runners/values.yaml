# Shared defaults; production overrides in values-production.yaml.
# Public repo: only AKV *key names* below — never secret values.

externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  # K8s Secret name consumed by githubConfigSecret (string form).
  secretName: github-arc-app
  remoteKeys:
    appId: github-arc-app-id
    installationId: github-arc-installation-id
    privateKey: github-arc-private-key

# Subchart: oci://ghcr.io/actions/actions-runner-controller-charts/gha-runner-scale-set
gha-runner-scale-set:
  githubConfigUrl: https://github.com/tranz-r
  githubConfigSecret: github-arc-app
  runnerScaleSetName: labgrid
  minRunners: 0
  maxRunners: 2
  controllerServiceAccount:
    namespace: arc-system
    name: arc-gha-rs-controller
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      containers:
        - name: runner
          image: ghcr.io/mcvavy/labgrid-actions-runner:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /home/runner/run.sh
          resources:
            requests:
              cpu: "1"
              memory: 2Gi
            limits:
              cpu: "2"
              memory: 6Gi
