# Production values for Labgrid Argo ApplicationSet (values-production.yaml only).
# Argo app name: gha-runners → namespace gha-runners-system.
# Secret *values* live only in Azure Key Vault; this file has key names only.

externalSecrets:
  enabled: true
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore
  refreshInterval: "1h"
  secretName: github-arc-app
  remoteKeys:
    appId: github-arc-app-id
    installationId: github-arc-installation-id
    privateKey: github-arc-private-key

gha-runner-scale-set:
  githubConfigUrl: https://github.com/tranz-r
  # Pre-defined Secret name created by ExternalSecret (sync-wave -1).
  githubConfigSecret: github-arc-app
  runnerScaleSetName: labgrid
  minRunners: 0
  maxRunners: 2
  controllerServiceAccount:
    namespace: arc-system
    name: arc-gha-rs-controller
  # Official ARC DinD mode: privileged docker:dind sidecar + DOCKER_HOST on runner.
  # Needed for Testcontainers / docker CLI jobs without installing Docker on k3s workers.
  containerMode:
    type: dind
  template:
    spec:
      affinity:
        nodeAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
            nodeSelectorTerms:
              - matchExpressions:
                  - key: node-role.kubernetes.io/control-plane
                    operator: DoesNotExist
                  - key: node-role.kubernetes.io/master
                    operator: DoesNotExist
      containers:
        - name: runner
          image: ghcr.io/mcvavy/labgrid-actions-runner:0.1.0
          imagePullPolicy: IfNotPresent
          command:
            - /home/runner/run.sh
          resources:
            # Runner + Chromium/Next CI, plus nested Testcontainers via DinD.
            requests:
              cpu: "2"
              memory: 4Gi
            limits:
              cpu: "4"
              memory: 12Gi
