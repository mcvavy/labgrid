{{- if .Values.httpRoute.enabled }}
{{- $g := .Values.gateway }}
{{- $sectionNames := default (list "http" "https") $g.sectionNames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "n8n.fullname" . }}
  labels:
    {{- include "n8n.labels" . | nindent 4 }}
  {{- with .Values.httpRoute.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
{{- range $sectionNames }}
    - name: {{ $g.name | quote }}
      namespace: {{ $g.namespace | quote }}
      sectionName: {{ . | quote }}
{{- end }}
  hostnames:
{{- range .Values.httpRoute.hostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: {{ .Values.httpRoute.path.type | default "PathPrefix" }}
            value: {{ .Values.httpRoute.path.value | default "/" | quote }}
      backendRefs:
        - name: {{ include "n8n.fullname" . | quote }}
          port: {{ .Values.service.port }}
{{- end }}
