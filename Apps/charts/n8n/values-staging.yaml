replicaCount: 1

n8nEnvironment:
- name: DB_TYPE
  value: "postgresdb"
- name: N8N_PORT
  value: "5678"
- name: N8N_PROTOCOL
  value: "https"
- name: N8N_HOST
  value: "automata-stg.labgrid.net"
- name: N8N_EDITOR_BASE_URL
  value: "https://automata-stg.labgrid.net/"
- name: WEBHOOK_URL
  value: "https://automata-stg.labgrid.net/"
- name: DB_POSTGRESDB_HOST
  valueFrom:
    secretKeyRef:
      name: n8n-stg-pgcluster-app
      key: host
- name: DB_POSTGRESDB_PORT
  valueFrom:
    secretKeyRef:
      name: n8n-stg-pgcluster-app
      key: port
- name: DB_POSTGRESDB_DATABASE
  valueFrom:
    secretKeyRef:
      name: n8n-stg-pgcluster-app
      key: dbname
- name: DB_POSTGRESDB_USER
  valueFrom:
    secretKeyRef:
      name: n8n-stg-pgcluster-app
      key: username
- name: DB_POSTGRESDB_PASSWORD
  valueFrom:
    secretKeyRef:
      name: n8n-stg-pgcluster-app
      key: password

ingress:
  enabled: false

gateway:
  name: labgrid-gateway
  namespace: nginx-gateway
  sectionNames:
    - http
    - https

httpRoute:
  enabled: true
  hostnames:
    - automata-stg.labgrid.net
  path:
    type: PathPrefix
    value: /


# Additional volumes on the output Deployment definition.
volumes:
- name: n8n-data
  persistentVolumeClaim:
    claimName: n8n-stg-storage

# Additional volumeMounts on the output Deployment definition.
volumeMounts:
- name: n8n-data
  mountPath: "/home/node/.n8n"

nodeSelector: {}

tolerations: []

affinity: {}


persistentVolumeClaim:
  create: true
  accessMode: ReadWriteOnce
  volumeMode: Filesystem
  size: 1Gi
  storageClassName: "local-path"
  existingPersistentVolumeClaim: ''
  annotations: {}
  # -- Additional labels for the persistent volume claim object.
  labels: {}

databaseCredential:
  secretName: n8n-stg-pgcluster-app

initContainer:
  command:
    - sh
    - -c
    - |
      until pg_isready -h "$N8N_STG_PGCLUSTER_RW_SERVICE_HOST" -p 5432; do 
        echo Waiting for the database to be ready...; 
        sleep 5; 
      done;


pgcluster:
  enabled: true
  type: postgresql

  version:
    # -- PostgreSQL major version to use
    postgresql: "17"

  mode: standalone

  cluster:
    instances: 1
    imageName: "ghcr.io/cloudnative-pg/postgresql:17.2"
    imagePullPolicy: IfNotPresent

    storage:
      size: 4Gi
      storageClass: "local-path"

    resources:
      requests:
        memory: "512Mi"
        cpu: "1"
      limits:
        memory: "1Gi"
        cpu: "2"

    priorityClassName: ""
    primaryUpdateMethod: switchover
    primaryUpdateStrategy: unsupervised
    logLevel: "info"

    affinity:
      enablePodAntiAffinity: true
      topologyKey: topology.kubernetes.io/zone

    enableSuperuserAccess: true

    enablePDB: true

    initdb:
      database: "n8n"
      owner: "labgridappuser"


  backups:
    enabled: false

  externalSecretBackupCredentials:
    enabled: false
