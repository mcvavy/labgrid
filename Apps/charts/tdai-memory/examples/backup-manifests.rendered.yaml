# Source: tdai-memory/templates/backup-rbac.yaml
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: tdai-memory-backup
  labels:
    helm.sh/chart: tdai-memory-0.2.0
    app.kubernetes.io/name: tdai-memory
    app.kubernetes.io/instance: tdai-memory
    app.kubernetes.io/version: "1.0.1"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: backup
rules:
  # Quiesce / resume Memory Core + Hub so RWO PVCs can be mounted for a consistent tar
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
    resourceNames:
      - "tdai-memory-core"
      - "tdai-memory-hub"
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
