{{- if .Values.hub.knowledge.httpRoute.enabled }}
{{- $g := .Values.gateway }}
{{- $sectionNames := default (list "http" "https") $g.sectionNames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tdai-memory.hub.fullname" . }}-knowledge
  labels:
    {{- include "tdai-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: hub-knowledge
spec:
  parentRefs:
{{- range $sectionNames }}
    - name: {{ $g.name | quote }}
      namespace: {{ $g.namespace | quote }}
      sectionName: {{ . | quote }}
{{- end }}
  hostnames:
{{- range .Values.hub.knowledge.httpRoute.hostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ printf "%s-knowledge" (include "tdai-memory.hub.fullname" .) | quote }}
          port: {{ .Values.hub.knowledge.service.port }}
{{- end }}
