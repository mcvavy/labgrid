apiVersion: v1
kind: Service
metadata:
  name: {{ include "tdai-memory.core.fullname" . }}
  labels:
    {{- include "tdai-memory.core.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.core.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "tdai-memory.core.selectorLabels" . | nindent 4 }}
