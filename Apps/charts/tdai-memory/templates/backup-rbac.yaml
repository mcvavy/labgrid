{{- if .Values.backup.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "tdai-memory.backup.fullname" . }}
  labels:
    {{- include "tdai-memory.backup.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "tdai-memory.backup.fullname" . }}
  labels:
    {{- include "tdai-memory.backup.labels" . | nindent 4 }}
rules:
  # Quiesce / resume Memory Core + Hub so RWO PVCs can be mounted for a consistent tar
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
    resourceNames:
      - {{ include "tdai-memory.core.fullname" . | quote }}
      - {{ include "tdai-memory.hub.fullname" . | quote }}
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "tdai-memory.backup.fullname" . }}
  labels:
    {{- include "tdai-memory.backup.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "tdai-memory.backup.fullname" . }}
subjects:
  - kind: ServiceAccount
    name: {{ include "tdai-memory.backup.fullname" . }}
    namespace: {{ .Release.Namespace }}
{{- end }}
