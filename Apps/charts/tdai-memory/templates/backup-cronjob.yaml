{{- if .Values.backup.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "tdai-memory.backup.fullname" . }}
  labels:
    {{- include "tdai-memory.backup.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.backup.schedule | quote }}
  timeZone: {{ .Values.backup.timeZone | quote }}
  concurrencyPolicy: {{ .Values.backup.concurrencyPolicy }}
  successfulJobsHistoryLimit: {{ .Values.backup.successfulJobsHistoryLimit }}
  failedJobsHistoryLimit: {{ .Values.backup.failedJobsHistoryLimit }}
  startingDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
  jobTemplate:
    metadata:
      labels:
        {{- include "tdai-memory.backup.labels" . | nindent 8 }}
    spec:
      backoffLimit: 1
      activeDeadlineSeconds: {{ .Values.backup.startingDeadlineSeconds }}
      template:
        metadata:
          labels:
            {{- include "tdai-memory.backup.labels" . | nindent 12 }}
        spec:
          serviceAccountName: {{ include "tdai-memory.backup.fullname" . }}
          restartPolicy: Never
          {{- with .Values.podSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          # 1) Scale Core/Hub to 0 so RWO PVCs are free and SQLite is quiescent
          # 2) Mount PVCs, tar, upload to Azure Blob, prune, scale back to 1
          initContainers:
            - name: quiesce
              image: "{{ .Values.backup.images.kubectl.repository }}:{{ .Values.backup.images.kubectl.tag }}"
              imagePullPolicy: {{ .Values.backup.images.kubectl.pullPolicy }}
              command: ["/bin/bash", "/scripts/quiesce.sh"]
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: CORE_DEPLOY
                  value: {{ include "tdai-memory.core.fullname" . | quote }}
                - name: HUB_DEPLOY
                  value: {{ include "tdai-memory.hub.fullname" . | quote }}
                - name: QUIESCE_TIMEOUT_SECONDS
                  value: {{ .Values.backup.quiesceTimeoutSeconds | quote }}
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: shared
                  mountPath: /shared
          containers:
            - name: backup
              image: "{{ .Values.backup.images.azureCli.repository }}:{{ .Values.backup.images.azureCli.tag }}"
              imagePullPolicy: {{ .Values.backup.images.azureCli.pullPolicy }}
              command: ["/bin/bash", "/scripts/backup.sh"]
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: CORE_DEPLOY
                  value: {{ include "tdai-memory.core.fullname" . | quote }}
                - name: HUB_DEPLOY
                  value: {{ include "tdai-memory.hub.fullname" . | quote }}
                - name: AZURE_STORAGE_ACCOUNT
                  value: {{ .Values.backup.destination.storageAccount | quote }}
                - name: AZURE_STORAGE_CONTAINER
                  value: {{ .Values.backup.destination.container | quote }}
                - name: CORE_PREFIX
                  value: {{ .Values.backup.destination.corePrefix | quote }}
                - name: HUB_PREFIX
                  value: {{ .Values.backup.destination.hubPrefix | quote }}
                - name: RETENTION_DAYS
                  value: {{ .Values.backup.retentionDays | quote }}
                - name: KUBECTL_BIN
                  value: /shared/kubectl
              volumeMounts:
                - name: scripts
                  mountPath: /scripts
                  readOnly: true
                - name: shared
                  mountPath: /shared
                - name: secrets
                  mountPath: /secrets
                  readOnly: true
                - name: core-data
                  mountPath: /pvc/core
                  readOnly: true
                - name: hub-data
                  mountPath: /pvc/hub
                  readOnly: true
                - name: work
                  mountPath: /work
              {{- with .Values.backup.resources }}
              resources:
                {{- toYaml . | nindent 16 }}
              {{- end }}
          volumes:
            - name: scripts
              configMap:
                name: {{ include "tdai-memory.backup.fullname" . }}-script
                defaultMode: 0755
            - name: shared
              emptyDir: {}
            - name: work
              emptyDir: {}
            - name: secrets
              secret:
                secretName: {{ include "tdai-memory.backup.secretName" . }}
            - name: core-data
              persistentVolumeClaim:
                claimName: {{ include "tdai-memory.core.fullname" . }}-data
                readOnly: true
            - name: hub-data
              persistentVolumeClaim:
                claimName: {{ include "tdai-memory.hub.fullname" . }}-knowledge
                readOnly: true
          {{- with .Values.nodeSelector }}
          nodeSelector:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.affinity }}
          affinity:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          {{- with .Values.tolerations }}
          tolerations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
{{- end }}
