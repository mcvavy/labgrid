{{- if .Values.core.httpRoute.enabled }}
{{- $g := .Values.gateway }}
{{- $sectionNames := default (list "http" "https") $g.sectionNames }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "tdai-memory.core.fullname" . }}
  labels:
    {{- include "tdai-memory.core.labels" . | nindent 4 }}
spec:
  parentRefs:
{{- range $sectionNames }}
    - name: {{ $g.name | quote }}
      namespace: {{ $g.namespace | quote }}
      sectionName: {{ . | quote }}
{{- end }}
  hostnames:
{{- range .Values.core.httpRoute.hostnames }}
    - {{ . | quote }}
{{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "tdai-memory.core.fullname" . | quote }}
          port: {{ .Values.core.service.port }}
{{- end }}
