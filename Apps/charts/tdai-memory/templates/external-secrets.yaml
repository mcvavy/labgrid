{{- if .Values.externalSecrets.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tdai-memory.secrets.name" . }}
  labels:
    {{- include "tdai-memory.labels" . | nindent 4 }}
    app.kubernetes.io/component: credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.secretStoreRef.name }}
    kind: {{ .Values.externalSecrets.secretStoreRef.kind }}
  target:
    name: {{ include "tdai-memory.secrets.name" . }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      data:
        gateway-api-key: "{{ `{{ .gatewayApiKey }}` }}"
        llm-api-key: "{{ `{{ .llmApiKey }}` }}"
        {{- if .Values.externalSecrets.keys.deepseekBaseUrl }}
        llm-base-url: "{{ `{{ .llmBaseUrl }}` }}"
        {{- else }}
        llm-base-url: {{ .Values.llm.baseUrl | quote }}
        {{- end }}
        {{- if .Values.externalSecrets.keys.deepseekModel }}
        llm-model: "{{ `{{ .llmModel }}` }}"
        {{- else }}
        llm-model: {{ .Values.llm.model | quote }}
        {{- end }}
  data:
    - secretKey: gatewayApiKey
      remoteRef:
        key: {{ .Values.externalSecrets.keys.gatewayApiKey }}
    - secretKey: llmApiKey
      remoteRef:
        key: {{ .Values.externalSecrets.keys.deepseekApiKey }}
    {{- if .Values.externalSecrets.keys.deepseekBaseUrl }}
    - secretKey: llmBaseUrl
      remoteRef:
        key: {{ .Values.externalSecrets.keys.deepseekBaseUrl }}
    {{- end }}
    {{- if .Values.externalSecrets.keys.deepseekModel }}
    - secretKey: llmModel
      remoteRef:
        key: {{ .Values.externalSecrets.keys.deepseekModel }}
    {{- end }}
{{- end }}
