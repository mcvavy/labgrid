{{- if and .Values.backup.enabled .Values.backup.externalSecret.enabled }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "tdai-memory.backup.secretName" . }}
  labels:
    {{- include "tdai-memory.backup.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: {{ .Values.backup.externalSecret.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.backup.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.backup.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ include "tdai-memory.backup.secretName" . }}
    creationPolicy: Owner
  data:
    - secretKey: sas-token
      remoteRef:
        key: {{ .Values.backup.externalSecret.keys.sasToken }}
{{- end }}
