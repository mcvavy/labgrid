# Default values for tdai-memory.

nameOverride: ""
fullnameOverride: ""

gateway:
  name: labgrid-gateway
  namespace: nginx-gateway
  sectionNames:
    - http
    - https

core:
  replicaCount: 1
  image:
    repository: agentmemory/memory-core
    tag: "1.0.1-beta.1"
    pullPolicy: IfNotPresent
  service:
    port: 8420
  httpRoute:
    enabled: true
    hostnames:
      - memory.labgrid.net
  persistentVolumeClaim:
    accessMode: ReadWriteOnce
    volumeMode: Filesystem
    size: 5Gi
    storageClassName: synology-iscsi-delete
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 15
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health
      port: http
    initialDelaySeconds: 5
    periodSeconds: 10
  # FTS-first standalone gateway (matches host ~/agent-memory setup)
  promptMode: code
  recallStrategy: fts

hub:
  replicaCount: 1
  image:
    repository: agentmemory/memory-hub
    tag: "1.0.1-beta.2"
    pullPolicy: IfNotPresent
  panel:
    service:
      port: 8125
    httpRoute:
      enabled: true
      hostnames:
        - memory-hub.labgrid.net
  knowledge:
    service:
      port: 8424
    httpRoute:
      enabled: true
      hostnames:
        - memory-ks.labgrid.net
    # Must be publicly reachable; Hub Knowledge public base (include /v3)
    publicBaseUrl: https://memory-ks.labgrid.net/v3
  # Panel "client URL" card — Core HTTPS (no Proxy in this chart)
  remoteInstanceProxyUrl: https://memory.labgrid.net
  persistentVolumeClaim:
    accessMode: ReadWriteOnce
    volumeMode: Filesystem
    size: 10Gi
    storageClassName: synology-iscsi-delete
  resources: {}
  livenessProbe:
    httpGet:
      path: /health
      port: panel
    initialDelaySeconds: 20
    periodSeconds: 20
  readinessProbe:
    httpGet:
      path: /health
      port: panel
    initialDelaySeconds: 10
    periodSeconds: 10

llm:
  mode: custom
  protocol: openai
  # Defaults when not overridden by ExternalSecret keys
  baseUrl: https://api.deepseek.com/v1
  model: deepseek-v4-flash

externalSecrets:
  enabled: true
  refreshInterval: 1h
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore
  targetSecretName: tdai-memory-credentials
  # AKV secret names (values only — never commit real secrets)
  keys:
    gatewayApiKey: tdai-gateway-api-key
    deepseekApiKey: tdai-deepseek-api-key
    # Optional overrides; omit remoteRef by leaving empty string to use values.llm.*
    deepseekBaseUrl: ""
    deepseekModel: ""

# Offline-ish PVC tar → Azure Blob (see templates/backup-*.yaml)
backup:
  enabled: false
  schedule: "0 3 * * *"
  timeZone: UTC
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  startingDeadlineSeconds: 7200
  # Brief outage while Core/Hub are scaled to 0 so RWO PVCs can be mounted consistently
  quiesceTimeoutSeconds: 300
  retentionDays: 30
  destination:
    storageAccount: labgrid
    container: tdai-memory-backup
    corePrefix: core
    hubPrefix: hub
  images:
    kubectl:
      repository: alpine/k8s
      tag: "1.31.13"
      pullPolicy: IfNotPresent
    azureCli:
      repository: mcr.microsoft.com/azure-cli
      tag: "2.67.0"
      pullPolicy: IfNotPresent
  externalSecret:
    enabled: true
    refreshInterval: 1h
    targetSecretName: tdai-memory-backup-credentials
    secretStoreRef:
      name: azure-kv-cluster-store
      kind: ClusterSecretStore
    # AKV secret names only
    keys:
      # SAS for container tdai-memory-backup (read/write/list/delete as needed)
      sasToken: tdai-memory-backup-sas-token
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

podSecurityContext: {}
securityContext: {}
nodeSelector: {}
tolerations: []
affinity: {}
