externalSecrets:
  enabled: true
  refreshInterval: "1h"
  secretStoreRef:
    name: azure-kv-cluster-store
    kind: ClusterSecretStore
  rabbitmq:
    name: rabbitmq-credentials
    # AKV keys (password + cookie). Template adds operator keys username / default_user.conf / .erlang.cookie.
    remotePasswordKey: platform-rabbitmq-password
    remoteErlangCookieKey: platform-rabbitmq-erlang-cookie
    username: admin

rabbitmqCluster:
  name: rabbitmq
  # Odd replica count required for broker/quorum HA (operator docs).
  replicas: 3
  # Required: CloudPirates operator chart leaves ENABLE_WEBHOOKS=false (no image defaulting).
  image: docker.io/library/rabbitmq:4.3.4-management-alpine
  persistence:
    storageClassName: synology-iscsi-delete-wffc
    storage: 5Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      cpu: "1"
      memory: 1Gi
  # Node-wide DQT + migration helper: https://www.rabbitmq.com/docs/vhosts#node-wide-default-queue-type-node-wide-dqt
  additionalConfig: |
    default_queue_type = quorum
    quorum_queue.property_equivalence.relaxed_checks_on_redeclaration = true
