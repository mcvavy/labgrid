# Build/push the TDAI Memory Core upsert overlay (public GHCR package for cluster pull).
# Same pattern as arc-runner-image.yml — GITHUB_TOKEN pushes; package made public so
# tdai-memory Deployment needs no imagePullSecrets.
name: TDAI Memory Core overlay image

on:
  push:
    branches: [main]
    paths:
      - "Apps/charts/tdai-memory/core-image/**"
      - ".github/workflows/tdai-memory-core-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/tdai-memory-core
  IMAGE_TAG: "scenario-upsert-20260915"

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Apps/charts/tdai-memory/core-image
          file: Apps/charts/tdai-memory/core-image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # User-owned package visibility (mcvavy). Ignore if already public / org-owned.
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/tdai-memory-core/visibility" \
            -f visibility=public \
            || true
