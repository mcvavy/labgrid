# Build/push the custom ARC runner image (ubuntu-latest — chicken/egg until image exists).
name: ARC runner image

on:
  push:
    branches: [main]
    paths:
      - "Apps/charts/gha-runners/runner-image/**"
      - ".github/workflows/arc-runner-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/labgrid-actions-runner
  IMAGE_TAG: "0.1.0"

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Apps/charts/gha-runners/runner-image
          file: Apps/charts/gha-runners/runner-image/Dockerfile
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # User-owned package visibility (mcvavy). Ignore if already public / org-owned.
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/labgrid-actions-runner/visibility" \
            -f visibility=public \
            || true
