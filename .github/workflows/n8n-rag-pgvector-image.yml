# Build/push CloudNativePG PostgreSQL 17 + pgvector for n8n RAG.
# Tag must start with PG version (CNPG version detection). Public package preferred
# so n8n-rag-system pods need no imagePullSecrets.
name: n8n-rag CNPG pgvector image

on:
  push:
    branches: [main]
    paths:
      - "Apps/charts/n8n-rag/image/**"
      - ".github/workflows/n8n-rag-pgvector-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/labgrid-cnpg-pgvector
  # Must start with PostgreSQL major.minor for CloudNativePG.
  IMAGE_TAG: "17.2"
  PACKAGE_NAME: labgrid-cnpg-pgvector

jobs:
  build-push:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: Apps/charts/n8n-rag/image
          file: Apps/charts/n8n-rag/image/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Make package public (best effort)
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api \
            --method PUT \
            -H "Accept: application/vnd.github+json" \
            "/user/packages/container/${PACKAGE_NAME}/visibility" \
            -f visibility=public \
            || true
