# Global NGINX data-plane Service settings for all Gateways managed by this NGF.
# Keep ingress-nginx on MetalLB 192.168.1.204; pin NGF Gateway VIP to .205.
#
# gwAPIExperimentalFeatures: required for TCPRoute (Forgejo SSH on labgrid-gateway).
nginxGateway:
  gwAPIExperimentalFeatures:
    enable: true

nginx:
  service:
    type: LoadBalancer
    externalTrafficPolicy: Local
    loadBalancerIP: "192.168.1.205"
