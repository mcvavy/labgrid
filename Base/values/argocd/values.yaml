# Argo CD via argo-helm (Base pin → app v3.4.6). Values shape is stable across chart 7→10
# for global.domain / configs / server.certificate / server.ingress used below.
# https://github.com/argoproj/argo-helm/blob/main/charts/argo-cd/values.yaml
# Upgrade notes (2.14 → 3.x): https://argo-cd.readthedocs.io/en/stable/operator-manual/upgrading/2.14-3.0/

global:
  domain: argocd.labgrid.net

configs:
  cm:
    exec.enabled: true
    # https://argo-cd.readthedocs.io/en/stable/operator-manual/user-management/#create-new-user
    accounts.labgrid-user: "apiKey, login"
    accounts.admin: "apiKey, login"
    # Keep v2-style Application update/delete applying to managed resources (sync/prune UI).
    server.rbac.disableApplicationFineGrainedRBACInheritance: "false"

  rbac:
    create: true
    policy.csv: |
      g, labgrid-user, role:admin
  params:
    server.insecure: true

server:
  certificate:
    enabled: true
    secretName: argocd-server-tls
    domain: "argocd.local.labgrid.net"
    additionalHosts:
      - argocd.labgrid.net

    issuer:
      group: "cert-manager.io"
      kind: "ClusterIssuer"
      name: "letsencrypt-production"

  ingress:
    enabled: true

    ingressClassName: "nginx"

    hostname: "argocd.local.labgrid.net"

    tls: true

    extraHosts:
      - name: argocd.labgrid.net
        path: /
